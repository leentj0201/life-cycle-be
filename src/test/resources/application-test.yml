spring:
  datasource:
    url: jdbc:postgresql://3.34.74.224:5432/life_cycle
    username: life_cycle_user
    password: life_cycle_user123!
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000
  
  jpa:
    hibernate:
      ddl-auto: none  # validate 대신 none 사용
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
    show-sql: true
    open-in-view: false

# 테스트 환경 설정
logging:
  level:
    com.twothree.backend: DEBUG
    org.hibernate.SQL: DEBUG
    root: WARN
